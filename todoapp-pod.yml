apiVersion: v1
kind: Pod
metadata:
  name: myfirst-pod
  namespace: mateapp
  labels: 
    app: myfirst-pod
spec:
  containers:
  - name: myfirst-pod
    image: demops096/todoapp:3.0.0
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
